arrangement:
  tracks:
    lead:
      instrument: lead/supersaw_lead
      role: lead
      content:
        type: melody
        part: lead
    pluck:
      instrument: keys/glass_pluck
      role: texture
      content:
        type: melody
        part: pluck
    topline:
      instrument: keys/vocal_sketch
      role: topline
      mute: true
      content:
        type: melody
        part: topline
    arp:
      instrument: keys/glass_pluck
      role: texture
      content:
        type: arp
        range:
        - F#5
        - B6
        voices: 4
        order: 0 1 2 3 2 1 0 2
        patterns:
          drop: x.x.x.x.x.x.x.x.
    pad:
      instrument: pad/warm_pad
      role: harmony
      content:
        type: chords
        range:
        - D3
        - A4
        voices: 4
        patterns:
          intro: x---------------
          build:
            '3': x-------x-------
            default: x---------------
          drop: x---------------
          end:
          - x---------------
          - '----------------'
    shimmer:
      instrument: pad/air_shimmer
      role: texture
      content:
        type: chords
        range:
        - C#6
        - D7
        voices: 3
        patterns:
          intro:
            4-7: x---------------
            default: ''
          build: x---------------
          drop: x---------------
          end:
          - x---------------
          - '----------------'
    chords:
      instrument: pad/saw_chords
      role: harmony
      content:
        type: chords
        range:
        - D3
        - A4
        voices: 4
        patterns:
          drop: x---------------
          end:
          - x---------------
          - '--------........'
    bass:
      instrument: bass/sub_saw_bass
      role: bass
      content:
        type: bass
        range:
        - G#1
        - G2
        patterns:
          intro: ''
          build:
            0-1: x---------------
            '2': x-------........
            '3': x-------x-------
          drop:
            '0': x.x-..x-..x-..u-
            default: ..x-..x-..x-..u-
          end:
          - x-------........
          - ''
    kick:
      instrument: drums/kick_main
      content:
        type: drums
        patterns:
          intro:
            0-3: ''
            default: x...x...x...x...
          build:
            '3': ''
            default: x...x...x...x...
          drop: x...x...x...x...
          end:
          - x...............
          - ''
    clap:
      instrument: drums/clap_main
      content:
        type: drums
        patterns:
          drop: '....x.......x...'
    hat:
      instrument: drums/hat_closed
      content:
        type: drums
        patterns:
          intro:
            0-3: ''
            default: ..x...x...x...x.
          build:
            '3': x.x.x.x.x.x.....
            default: x.x.x.x.x.x.x.x.
          drop: xoxoxoxoxoxoxoxo
    ohat:
      instrument: drums/hat_open
      content:
        type: drums
        patterns:
          drop: ..x...x...x...x.
    snare:
      instrument: drums/snare_roll
      content:
        type: drums
        patterns:
          build:
          - '....x.......x...'
          - x...x...x...x...
          - x.x.x.x.x.x.x.x.
          - xxxxxxxxxxxxxxxxxxxxxxxx........
        ramp:
          build:
            vel:
            - 0.35
            - 1.0
            pitch:
            - 0
            - 9
    crash:
      instrument: drums/crash
      content:
        type: drums
        patterns:
          drop:
            '0': x...............
            '4': x...............
            default: ''
          end:
          - x...............
          - ''
    riser:
      instrument: fx/riser
      content:
        type: fx
        events:
        - at: build:0
          until: build:end
          vel: 0.9
    revcrash:
      instrument: fx/reverse_crash
      content:
        type: fx
        events:
        - at: build:3|2
          until: build:end
    impact:
      instrument: fx/impact
      content:
        type: fx
        events:
        - at: drop:0
          beats: 4
        - at: end:0
          beats: 4
          vel: 0.4
  automation:
  - target: pluck.lpf
