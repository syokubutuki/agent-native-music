# Shower spray (ざー): broadband noise, softened top, slow in/out. Pitch is ignored.
type: subtractive
oscillators:
  - {wave: noise, level: 1.0}
filter: {mode: lowpass, cutoff: 3000, q: 0.5, slope: 12}
amp_env: {a: 0.35, d: 0.5, s: 0.9, r: 1.0}
velocity_sens: 0.3
gain_db: 0
fx:
  - {type: highpass, freq: 700}
  - {type: width, amount: 1.4}
