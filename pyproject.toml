[project]
name = "agent-native-music"
version = "0.1.0"
description = "Agent-native music production: a text-first, deterministic, tool-callable music project core."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
anm = "anm.cli:main"
anm-mcp = "anm.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
