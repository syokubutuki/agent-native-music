[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "music-agent"
version = "0.1.0"
description = "Agent-native music production engine: composition spec -> MIDI -> synthesis -> mix -> analysis -> critique"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
    "soundfile>=0.12",
    "mido>=1.3",
    "PyYAML>=6.0",
    "pedalboard>=0.9",
    "pyloudnorm>=0.1.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
analysis = ["librosa>=0.10"]
dev = ["pytest>=7"]

[project.scripts]
music-agent = "music_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
