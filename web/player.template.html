<title>Agent Native Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: 1 column. Title, then a player card (play button + current chord + 8-bar strip),
   then controls, part toggles, and a listening-notes form that Claude reads back. */
:root {
  --bg: #e8edf1;
  --surface: #f6f8fa;
  --ink: #1d2a35;
  --muted: #566774;
  --line: #cdd7de;
  --accent: #2f6690;
  --accent-ink: #ffffff;
  --lamp: #c9822b;
  --danger: #a8402f;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181f; --surface: #19232c; --ink: #e3ebf1; --muted: #93a4b1; --line: #2a3945;
    --accent: #7fb2d8; --accent-ink: #0f1a22; --lamp: #e0a04a; --danger: #e08a77;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181f; --surface: #19232c; --ink: #e3ebf1; --muted: #93a4b1; --line: #2a3945;
  --accent: #7fb2d8; --accent-ink: #0f1a22; --lamp: #e0a04a; --danger: #e08a77;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; padding-inline: 16px; padding-block: 28px 56px; }
main { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; line-height: 1.2; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
.kicker { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.meta { color: var(--muted); font-size: 0.9rem; }
.meta .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
header { display: flex; flex-direction: column; gap: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.transport { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
#play { width: 68px; height: 68px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; flex: none; }
#play svg { width: 26px; height: 26px; fill: currentColor; }
#play .ico-pause { display: none; }
#play[aria-pressed="true"] .ico-play { display: none; }
#play[aria-pressed="true"] .ico-pause { display: block; }
.now { min-width: 0; display: flex; flex-direction: column; }
.now-label { font-size: 0.75rem; color: var(--muted); }
#chord { font-family: var(--font-mono); font-size: 2rem; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
.strip { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
button.bar { font: inherit; color: inherit; background: transparent; cursor: pointer; }
.bar { border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; transition: background-color .12s, border-color .12s; }
.bar .chords { font-family: var(--font-mono); font-size: 0.72rem; line-height: 1.25; text-align: center; overflow-wrap: anywhere; min-height: 2.5em; display: flex; flex-direction: column; justify-content: center; }
.bar .sec { font-size: 0.64rem; line-height: 1.2; color: var(--muted); text-align: center; min-height: 1.2em; overflow-wrap: anywhere; }
.bar .dots { display: flex; gap: 3px; }
.bar .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
.bar.on { border-color: var(--lamp); background: color-mix(in srgb, var(--lamp) 14%, transparent); }
.bar.on .dots i.on { background: var(--lamp); }
.seekrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.seekrow input { flex: 1 1 200px; min-width: 0; }
.seekrow output { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hint { font-size: 0.82rem; color: var(--muted); }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px 24px; }
.ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ctl label, .ctl .lbl { display: flex; justify-content: space-between; gap: 8px; font-weight: 500; }
.ctl output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctl label.check { justify-content: flex-start; align-items: center; gap: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 0.86rem; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.muted-part[aria-pressed="false"] { text-decoration: line-through; color: var(--muted); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.section { display: flex; flex-direction: column; gap: 12px; }
.rating { display: flex; gap: 6px; flex-wrap: wrap; }
.rating input { position: absolute; opacity: 0; pointer-events: none; }
.rating label { cursor: pointer; padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.86rem; }
.rating input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rating input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { font: inherit; width: 100%; min-height: 96px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { font: inherit; font-weight: 700; padding: 8px 20px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
.status { font-size: 0.86rem; color: var(--muted); }
.status.err { color: var(--danger); }
.note { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.note-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-size: 0.82rem; color: var(--muted); }
.note-head .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.note-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.note-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.note-tags span { font-size: 0.78rem; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.del { font: inherit; font-size: 0.78rem; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; }
.del.confirm { color: var(--danger); }
@media (max-width: 480px) {
  .card { padding: 14px; }
  .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  h1 { font-size: 1.7rem; }
}
@media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>

<main>
  <header>
    <span class="kicker">Agent Native Music</span>
    <h1 id="title"></h1>
    <p class="meta" id="desc"></p>
    <p class="meta" id="facts"></p>
    <div class="ctl" id="versionBox">
      <span class="lbl">版を選んで聴き比べる</span>
      <div class="chips" id="versions"></div>
      <p class="hint" id="changes"></p>
    </div>
  </header>

  <section class="card" aria-label="プレーヤー">
    <div class="transport">
      <button id="play" type="button" aria-pressed="false" aria-label="再生">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>
      </button>
      <div class="now">
        <span class="now-label">いま鳴っているコード</span>
        <span id="chord">–</span>
        <span class="now-label" id="scene"></span>
      </div>
    </div>
    <div class="chips" id="scenes" aria-label="場面へ移動"></div>
    <div class="strip" id="strip" aria-label="小節ごとの進行"></div>
    <div class="seekrow">
      <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="再生位置">
      <output id="seekOut" class="mono" aria-live="off"></output>
    </div>
    <p class="hint">帯の小節や上の場面ボタンを押すと、そこから再生します。バーを動かすと拍(ひと区切り)単位で好きな位置から聴けます。コードは「同時に鳴らす音のセット」のことです。曲は最後まで行くと最初に戻って繰り返します。</p>
  </section>

  <section class="section" aria-label="調整">
    <h2>聴き方を調整する</h2>
    <div class="controls">
      <div class="ctl">
        <label for="tempo"><span>テンポ(速さ)</span><output id="tempoOut"></output></label>
        <input id="tempo" type="range" min="50" max="110" step="1">
      </div>
      <div class="ctl">
        <label for="vol"><span>音量</span><output id="volOut"></output></label>
        <input id="vol" type="range" min="0" max="100" step="1" value="70">
      </div>
      <div class="ctl">
        <span class="lbl">雨の音</span>
        <label class="check"><input id="rain" type="checkbox" checked> 窓を打つ雨を重ねる</label>
      </div>
    </div>
    <div class="ctl">
      <span class="lbl">パート(押すと消えます。何が鳴っているか確かめるのに使えます)</span>
      <div class="chips" id="parts"></div>
    </div>
  </section>

  <section class="section" aria-label="感想">
    <h2>この曲の感想</h2>
    <p class="hint" id="noteFor"></p>
    <p class="hint">ここに書いた感想は保存され、次に曲を作り直すとき AI が読んで反映します。短い言葉で構いません。</p>
    <fieldset style="border:0;padding:0;margin:0;min-width:0">
      <legend class="lbl" style="font-weight:500;padding:0;margin-bottom:6px">どれくらい好きですか</legend>
      <div class="rating" id="rating"></div>
    </fieldset>
    <div class="ctl">
      <span class="lbl">当てはまるものを選ぶ</span>
      <div class="chips" id="tags"></div>
    </div>
    <div class="ctl">
      <label for="noteText"><span>自由に書く</span></label>
      <textarea id="noteText" placeholder="例: 2小節目のメロディが好き。ドラムはもう少し小さくていい。"></textarea>
    </div>
    <div class="row">
      <button class="btn" id="save" type="button">感想を保存</button>
      <span class="status" id="saveStatus" role="status"></span>
    </div>
    <div id="notes" aria-live="polite"></div>
  </section>
</main>

<script>
const SONGS = __SONG_JSON__;
let SONG = SONGS[SONGS.length - 1]; // 既定は最新の版

/* ---------- score -> events ---------- */
const TPB = 12; // ticks per beat (supports 8ths, 16ths and triplets)
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const DRUMS = ['kick', 'snare', 'hat'];
const NOPITCH = [...DRUMS, 'riser'];
function freqOf(name) {
  const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
  const midi = 12 * (Number(m[3]) + 1) + SEMI[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
let BPB, TOTAL_TICKS, byTick;
function compile() {
  BPB = SONG.beatsPerBar;
  TOTAL_TICKS = SONG.bars * BPB * TPB;
  byTick = Array.from({ length: TOTAL_TICKS }, () => null);
  SONG.tracks.forEach((t, ti) => {
    for (const [beat, dur, pitch, vel] of t.notes) {
      const tick = Math.round(beat * TPB);
      (byTick[tick] ||= []).push({ ti, inst: t.instrument, dur, vel, freq: NOPITCH.includes(t.instrument) ? 0 : freqOf(pitch) });
    }
  });
}
compile();

/* ---------- state ---------- */
let ctx = null, master, mix, verb, buses = [], wobbleGain, noiseBuf, rainGain;
let bpm = SONG.bpm, volume = 0.7, rainOn = true;
let mutedParts = SONG.tracks.map(() => false);
let playing = false, timer = null, raf = null, pauseTimer = null;
let tickPos = 0, tickTime = 0, curBeat = 0, dragging = false;
const visQ = [];

/* ---------- audio graph ---------- */
function makeImpulse(seconds) {
  const len = Math.floor(ctx.sampleRate * seconds), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
  }
  return buf;
}
const SEND = { epiano: 0.45, pluck: 0.8, pad: 0.6, airpad: 0.85, bell: 1, riser: 0.25, bass: 0, kick: 0, snare: 0.35, hat: 0.08 };
function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 7500; tone.Q.value = 0.5;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 45;
  const shaper = ctx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < curve.length; i++) { const x = (i / 512) - 1; curve[i] = Math.tanh(1.6 * x) / Math.tanh(1.6); }
  shaper.curve = curve; shaper.oversample = '2x';
  mix = ctx.createGain(); mix.gain.value = 0.9;
  mix.connect(hp); hp.connect(shaper); shaper.connect(tone); tone.connect(comp); comp.connect(master); master.connect(ctx.destination);

  verb = ctx.createConvolver(); verb.buffer = makeImpulse(2.4);
  const verbLp = ctx.createBiquadFilter(); verbLp.type = 'lowpass'; verbLp.frequency.value = 3200;
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;
  verb.connect(verbLp); verbLp.connect(verbOut); verbOut.connect(tone);

  buildBuses();

  // slow tape-like pitch wobble shared by all tonal oscillators
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.55;
  wobbleGain = ctx.createGain(); wobbleGain.gain.value = 6; // cents
  lfo.connect(wobbleGain); lfo.start();

  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

  // rain: filtered noise with slow swells, bypasses the lo-fi chain
  const rs = ctx.createBufferSource(); rs.buffer = noiseBuf; rs.loop = true;
  const rlp = ctx.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.value = 4200;
  const rhp = ctx.createBiquadFilter(); rhp.type = 'highpass'; rhp.frequency.value = 800;
  rainGain = ctx.createGain(); rainGain.gain.value = rainOn ? 0.07 : 0;
  const swell = ctx.createOscillator(); swell.frequency.value = 0.13;
  const swellAmt = ctx.createGain(); swellAmt.gain.value = 0.012;
  swell.connect(swellAmt); swellAmt.connect(rainGain.gain); swell.start();
  rs.connect(rlp); rlp.connect(rhp); rhp.connect(rainGain); rainGain.connect(comp); rs.start();
}
function buildBuses() {
  buses = SONG.tracks.map((t, i) => {
    const g = ctx.createGain(); g.gain.value = mutedParts[i] ? 0 : t.gain;
    g.connect(mix);
    const s = ctx.createGain(); s.gain.value = SEND[t.instrument] ?? 0;
    g.connect(s); s.connect(verb);
    return g;
  });
}
function osc(type, freq, t, out, { detune = 0, wobble = true } = {}) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
  if (wobble) wobbleGain.connect(o.detune);
  o.connect(out); o.start(t);
  return o;
}
function noise(t, dur) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  s.start(t, Math.random() * 1.5, dur); return s;
}
function env(g, t, peak, attack, tau, dur, relTau) {
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.setTargetAtTime(peak * 0.38, t + attack, tau);
  g.gain.setTargetAtTime(0, t + dur, relTau);
}
// route a note through a stereo panner (falls back to mono where unsupported)
function panTo(out, p) {
  if (!ctx.createStereoPanner) return out;
  const sp = ctx.createStereoPanner(); sp.pan.value = p; sp.connect(out); return sp;
}
const INST = {
  epiano(t, e, out) {
    const spb = 60 / bpm, dur = e.dur * spb, peak = e.vel * 0.2;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400 + e.vel * 2200;
    const g = ctx.createGain(); lp.connect(g); g.connect(out);
    env(g, t, peak, 0.008, 0.55, dur, 0.14);
    const tine = ctx.createGain(); tine.gain.setValueAtTime(0.5, t); tine.gain.setTargetAtTime(0, t + 0.01, 0.07); tine.connect(lp);
    const end = t + dur + 1.2;
    for (const o of [osc('sine', e.freq, t, lp), osc('triangle', e.freq, t, lp, { detune: 5 }), osc('sine', e.freq * 2, t, tine)]) o.stop(end);
  },
  pluck(t, e, out) {
    const spb = 60 / bpm, dur = e.dur * spb;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const g = ctx.createGain(); lp.connect(g); g.connect(out);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(e.vel * 0.2, t + 0.005);
    g.gain.setTargetAtTime(e.vel * 0.05, t + 0.005, 0.28); g.gain.setTargetAtTime(0, t + dur, 0.2);
    const h = ctx.createGain(); h.gain.value = 0.3; h.connect(lp);
    for (const o of [osc('triangle', e.freq, t, lp), osc('sine', e.freq * 2, t, h)]) o.stop(t + dur + 1.5);
  },
  pad(t, e, out) {
    const spb = 60 / bpm, dur = e.dur * spb;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850;
    const g = ctx.createGain(); lp.connect(g); g.connect(out);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(e.vel * 0.05, t + 0.7);
    g.gain.setTargetAtTime(0, t + dur, 0.5);
    for (const o of [osc('sawtooth', e.freq, t, lp, { detune: -7 }), osc('sawtooth', e.freq, t, lp, { detune: 7 })]) o.stop(t + dur + 3);
  },
  // 晴れ間用: 高い音が長く伸びて消える、あちこちから聞こえるきらめき(木漏れ日)
  bell(t, e, out) {
    const dest = panTo(out, Math.random() * 1.4 - 0.7);
    const g = ctx.createGain(); g.connect(dest);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(e.vel * 0.15, t + 0.004);
    g.gain.setTargetAtTime(0, t + 0.004, 0.6);
    const h2 = ctx.createGain(); h2.gain.value = 0.28; h2.connect(g);
    const h3 = ctx.createGain(); h3.gain.value = 0.1; h3.connect(g);
    for (const o of [osc('sine', e.freq, t, g), osc('sine', e.freq * 2.01, t, h2), osc('sine', e.freq * 2.76, t, h3)]) o.stop(t + 4);
  },
  // 晴れ間用: ゆっくり立ち上がり、左右に広がる温かいパッド
  airpad(t, e, out) {
    const spb = 60 / bpm, dur = e.dur * spb;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.Q.value = 0.3;
    const g = ctx.createGain(); lp.connect(g); g.connect(out);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(e.vel * 0.045, t + 1.1);
    g.gain.setTargetAtTime(0, t + dur, 0.8);
    const left = ctx.createGain(), right = ctx.createGain();
    left.connect(panTo(lp, -0.6)); right.connect(panTo(lp, 0.6));
    const mid = ctx.createGain(); mid.gain.value = 0.6; mid.connect(lp);
    const end = t + dur + 4.5;
    for (const o of [osc('sawtooth', e.freq, t, left, { detune: -9 }), osc('sawtooth', e.freq, t, right, { detune: 9 }), osc('sine', e.freq, t, mid)]) o.stop(end);
  },
  // 予感用: 音の高さが上へ登っていく、ざわざわした音のせり上がり
  riser(t, e, out) {
    const spb = 60 / bpm, dur = e.dur * spb;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(6500, t + dur);
    const g = ctx.createGain(); s.connect(bp); bp.connect(g); g.connect(out);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(e.vel * 0.18, t + dur * 0.97);
    g.gain.linearRampToValueAtTime(0, t + dur + 0.06);
    s.start(t); s.stop(t + dur + 0.1);
  },
  bass(t, e, out) {
    const spb = 60 / bpm, dur = e.dur * spb;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = ctx.createGain(); lp.connect(g); g.connect(out);
    env(g, t, e.vel * 0.42, 0.012, 0.3, dur, 0.06);
    const h = ctx.createGain(); h.gain.value = 0.3; h.connect(lp);
    for (const o of [osc('sine', e.freq, t, lp), osc('triangle', e.freq * 2, t, h)]) o.stop(t + dur + 0.6);
  },
  kick(t, e, out) {
    const g = ctx.createGain(); g.connect(out);
    const o = osc('sine', 140, t, g, { wobble: false });
    o.frequency.exponentialRampToValueAtTime(46, t + 0.13);
    g.gain.setValueAtTime(e.vel * 0.85, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    o.stop(t + 0.4);
  },
  snare(t, e, out) {
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = 0.7;
    const g = ctx.createGain(); bp.connect(g); g.connect(out);
    g.gain.setValueAtTime(e.vel * 0.32, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    const n = noise(t, 0.25); n.connect(bp);
    const tg = ctx.createGain(); tg.connect(out);
    tg.gain.setValueAtTime(e.vel * 0.14, t); tg.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc('triangle', 190, t, tg, { wobble: false }).stop(t + 0.12);
  },
  hat(t, e, out) {
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5200;
    const g = ctx.createGain(); hp.connect(g); g.connect(out);
    g.gain.setValueAtTime(e.vel * 0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    noise(t, 0.08).connect(hp);
  },
};

/* ---------- scheduler ---------- */
function swingDelayBeats(tick) {
  const m = tick % TPB; // 6 = "and" of a beat, 3 and 9 = the 16ths
  if (m === 6) return SONG.swing / 6;
  if (m % 6 === 3) return SONG.swing / 12;
  return 0;
}
function schedule() {
  const horizon = ctx.currentTime + 0.2;
  while (tickTime < horizon) {
    const evs = byTick[tickPos];
    if (evs) {
      const when = tickTime + swingDelayBeats(tickPos) * (60 / bpm);
      for (const e of evs) {
        const jitter = DRUMS.includes(e.inst) ? 0.003 : 0.006;
        const ev = { ...e, vel: Math.min(1, e.vel * (0.92 + Math.random() * 0.16)) };
        INST[e.inst](Math.max(ctx.currentTime, when + (Math.random() * 2 - 1) * jitter), ev, buses[e.ti]);
      }
    }
    if (tickPos % 3 === 0) visQ.push({ time: tickTime, tick: tickPos });
    tickTime += 60 / bpm / TPB;
    tickPos = (tickPos + 1) % TOTAL_TICKS;
  }
}

/* ---------- transport ---------- */
const $ = (id) => document.getElementById(id);
function setPlayingUI(on) {
  const b = $('play'); b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-label', on ? '一時停止' : '再生');
}
async function play() {
  clearTimeout(pauseTimer);
  if (!ctx) { initAudio(); tickTime = ctx.currentTime + 0.08; }
  await ctx.resume();
  if (!playing) tickTime = Math.max(tickTime, ctx.currentTime + 0.05);
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(volume, ctx.currentTime, 0.04);
  playing = true; setPlayingUI(true);
  schedule();
  timer = setInterval(schedule, 25);
  if (!raf) raf = requestAnimationFrame(frame);
}
function pause() {
  playing = false; setPlayingUI(false);
  clearInterval(timer); timer = null;
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setTargetAtTime(0, ctx.currentTime, 0.04);
  pauseTimer = setTimeout(() => ctx.suspend(), 180);
}
$('play').addEventListener('click', () => { playing ? pause() : play(); });

/* ---------- visuals ---------- */
let chordAt = [], sectionAt = [], barEls = [], shown = -1;
function buildStrip() {
  chordAt = SONG.chords.slice().sort((a, b) => a.beat - b.beat);
  sectionAt = (SONG.sections || []).slice().sort((a, b) => a.bar - b.bar);
  barEls = []; shown = -1;
  const strip = $('strip'); strip.replaceChildren();
  for (let b = 0; b < SONG.bars; b++) {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'bar'; el.setAttribute('aria-label', `${b + 1}小節目から再生`);
    el.addEventListener('click', () => seekToBeat(b * BPB));
    const ch = document.createElement('div'); ch.className = 'chords';
    for (const c of chordAt) if (c.beat >= b * BPB && c.beat < (b + 1) * BPB) { const s = document.createElement('span'); s.textContent = c.label; ch.appendChild(s); }
    const sec = document.createElement('div'); sec.className = 'sec';
    const here = sectionAt.find((x) => x.bar === b); if (here) sec.textContent = here.label;
    const dots = document.createElement('div'); dots.className = 'dots';
    for (let i = 0; i < BPB; i++) dots.appendChild(document.createElement('i'));
    el.append(sec, ch, dots); strip.appendChild(el); barEls.push(el);
  }
  $('chord').textContent = '–'; $('scene').textContent = '';
  const sc = $('scenes'); sc.replaceChildren();
  for (const x of sectionAt) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = `▶ ${x.label}`;
    b.addEventListener('click', () => seekToBeat(x.bar * BPB));
    sc.appendChild(b);
  }
  sc.hidden = sectionAt.length === 0;
  const sk = $('seek'); sk.max = SONG.bars * BPB - 1; sk.value = 0; curBeat = 0; updatePos();
}
function fmtTime(sec) { const s = Math.max(0, Math.round(sec)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function posLabel(beat) {
  return `${Math.floor(beat / BPB) + 1}小節目 ${beat % BPB + 1}拍目 ・ ${fmtTime(beat * 60 / bpm)} / ${fmtTime(SONG.bars * BPB * 60 / bpm)}`;
}
function updatePos(beat = curBeat) { $('seekOut').textContent = posLabel(beat); }
// 任意の位置から再生する。鳴っている音は短く消してから、その拍の頭から始める
function seekToBeat(beat) {
  beat = Math.max(0, Math.min(SONG.bars * BPB - 1, Math.round(beat)));
  tickPos = beat * TPB; visQ.length = 0; curBeat = beat;
  if (ctx) {
    const old = buses, now = ctx.currentTime;
    for (const b of old) { b.gain.cancelScheduledValues(now); playing ? b.gain.setTargetAtTime(0, now, 0.008) : b.gain.setValueAtTime(0, now); }
    setTimeout(() => old.forEach((b) => b.disconnect()), 300);
    buildBuses(); tickTime = now + 0.06;
  }
  shown = -1; show(tickPos);
  if (!playing) play();
}
function show(tick) {
  const beatPos = Math.floor(tick / TPB);
  if (beatPos === shown) return;
  shown = beatPos; curBeat = beatPos;
  if (!dragging) $('seek').value = beatPos;
  updatePos(beatPos);
  const bar = Math.floor(beatPos / BPB), inBar = beatPos % BPB;
  barEls.forEach((el, i) => {
    el.classList.toggle('on', i === bar);
    el.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', i === bar && j <= inBar));
  });
  let cur = chordAt[0];
  for (const c of chordAt) if (c.beat <= beatPos) cur = c;
  $('chord').textContent = cur ? cur.label : '–';
  let sc = null;
  for (const x of sectionAt) if (x.bar <= bar) sc = x;
  $('scene').textContent = sc ? `場面: ${sc.label}` : '';
}
function frame() {
  raf = null;
  if (!ctx || ctx.state !== 'running') return;
  const t = ctx.currentTime - (ctx.outputLatency || ctx.baseLatency || 0);
  while (visQ.length > 1 && visQ[1].time <= t) visQ.shift();
  if (visQ[0] && visQ[0].time <= t) show(visQ[0].tick);
  raf = requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
function renderHeader() {
  $('title').textContent = SONG.title;
  $('desc').textContent = SONG.description || '';
  const secs = Math.round(SONG.bars * BPB * 60 / SONG.bpm);
  $('facts').replaceChildren('ローファイ / 元のテンポ ', Object.assign(document.createElement('span'), { className: 'mono', textContent: SONG.bpm + ' BPM' }),
    ` / 約${secs}秒をくり返し / 版 v${SONG.version}`);
  $('changes').textContent = SONG.changes ? `v${SONG.version} の変更点: ${SONG.changes}` : '';
  $('noteFor').textContent = `いま聴いている版は v${SONG.version} です。感想にはこの版の番号が付きます。`;
  $('versionBox').hidden = SONGS.length < 2;
  [...$('versions').children].forEach((b, i) => b.setAttribute('aria-pressed', String(SONGS[i] === SONG)));
}
const tempo = $('tempo');
const syncTempo = () => { bpm = Number(tempo.value); $('tempoOut').textContent = bpm + ' BPM'; if (typeof updatePos === 'function' && BPB) updatePos(); };
tempo.addEventListener('input', syncTempo); syncTempo();
const seek = $('seek');
seek.addEventListener('pointerdown', () => { dragging = true; });
seek.addEventListener('pointerup', () => { dragging = false; });
seek.addEventListener('input', () => updatePos(Number(seek.value)));
seek.addEventListener('change', () => { dragging = false; seekToBeat(Number(seek.value)); });
const vol = $('vol');
const syncVol = () => {
  volume = Number(vol.value) / 100; $('volOut').textContent = vol.value + '%';
  if (ctx && playing) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.03);
};
vol.addEventListener('input', syncVol); syncVol();
$('rain').addEventListener('change', (e) => {
  rainOn = e.target.checked;
  if (rainGain) rainGain.gain.setTargetAtTime(rainOn ? 0.07 : 0, ctx.currentTime, 0.2);
});
function renderParts() {
  $('parts').replaceChildren();
  SONG.tracks.forEach((t, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip muted-part';
    b.setAttribute('aria-pressed', String(!mutedParts[i])); b.textContent = t.name;
    b.addEventListener('click', () => {
      mutedParts[i] = !mutedParts[i];
      b.setAttribute('aria-pressed', String(!mutedParts[i]));
      if (buses[i]) buses[i].gain.setTargetAtTime(mutedParts[i] ? 0 : t.gain, ctx.currentTime, 0.03);
    });
    $('parts').appendChild(b);
  });
}
function switchSong(song) {
  if (song === SONG) return;
  SONG = song; compile();
  mutedParts = SONG.tracks.map(() => false);
  visQ.length = 0; tickPos = 0;
  if (ctx) { buses.forEach((b) => b.disconnect()); buildBuses(); tickTime = ctx.currentTime + 0.08; }
  tempo.value = SONG.bpm; syncTempo();
  buildStrip(); renderParts(); renderHeader();
}
SONGS.forEach((song) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = `v${song.version}`;
  b.addEventListener('click', () => switchSong(song));
  $('versions').appendChild(b);
});
tempo.value = SONG.bpm; syncTempo();
buildStrip(); renderParts(); renderHeader();

/* ---------- listening notes ---------- */
const TAGS = ['好き', 'ドラムが強い', 'ドラムが弱い', 'もっと切なく', 'もっと明るく', 'もっとゆっくり', 'もっと速く', '音が高くてきつい', '音がこもっている', '同じで飽きる', 'メロディがいい'];
const RATINGS = [[1, 'いまいち'], [2, 'うーん'], [3, 'ふつう'], [4, '好き'], [5, 'とても好き']];
let rating = 0; const chosen = new Set();
RATINGS.forEach(([v, label]) => {
  const id = 'r' + v, i = document.createElement('input'), l = document.createElement('label');
  i.type = 'radio'; i.name = 'rating'; i.id = id; i.value = v; l.htmlFor = id; l.textContent = v + ' ' + label;
  i.addEventListener('change', () => { rating = v; });
  $('rating').append(i, l);
});
TAGS.forEach((t) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.setAttribute('aria-pressed', 'false'); b.textContent = t;
  b.addEventListener('click', () => {
    const on = !chosen.has(t); on ? chosen.add(t) : chosen.delete(t); b.setAttribute('aria-pressed', String(on));
  });
  $('tags').appendChild(b);
});

let notesCol = null;
const status = (msg, isErr) => { const s = $('saveStatus'); s.textContent = msg; s.classList.toggle('err', !!isErr); };
function renderNotes(docs) {
  const box = $('notes'); box.replaceChildren();
  if (!docs.length) {
    const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'まだ感想はありません。聴いたあとに最初の1件を書いてみてください。'; box.appendChild(p); return;
  }
  for (const d of docs) {
    const n = d.data(), el = document.createElement('div'); el.className = 'note';
    const head = document.createElement('div'); head.className = 'note-head';
    const when = document.createElement('span'); when.className = 'mono';
    when.textContent = new Date(n.createdAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const ver = document.createElement('span'); ver.className = 'mono'; ver.textContent = `v${n.songVersion} / ${n.bpm} BPM`;
    head.append(when, ver);
    if (n.rating) { const r = document.createElement('span'); r.textContent = `好き度 ${n.rating}/5`; head.appendChild(r); }
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '削除';
    del.addEventListener('click', async () => {
      if (!del.classList.contains('confirm')) { del.classList.add('confirm'); del.textContent = 'もう一度押すと削除'; return; }
      try { await notesCol.doc(d.id).delete(); } catch { del.textContent = '削除できませんでした'; }
    });
    head.appendChild(del); el.appendChild(head);
    if (n.tags && n.tags.length) { const tg = document.createElement('div'); tg.className = 'note-tags'; for (const t of n.tags) { const s = document.createElement('span'); s.textContent = t; tg.appendChild(s); } el.appendChild(tg); }
    if (n.text) { const p = document.createElement('p'); p.className = 'note-text'; p.textContent = n.text; el.appendChild(p); }
    box.appendChild(el);
  }
}
$('save').addEventListener('click', async () => {
  const text = $('noteText').value.trim();
  if (!notesCol) return;
  if (!rating && !chosen.size && !text) { status('好き度・当てはまるもの・文章のどれかを入れてください。', true); return; }
  const btn = $('save'); btn.disabled = true; status('保存中…');
  try {
    await notesCol.add({ songId: SONG.id, songVersion: SONG.version, bpm, rating, tags: [...chosen], text, createdAt: new Date().toISOString() });
    $('noteText').value = ''; chosen.clear(); rating = 0;
    document.querySelectorAll('#tags .chip').forEach((c) => c.setAttribute('aria-pressed', 'false'));
    document.querySelectorAll('#rating input').forEach((c) => { c.checked = false; });
    status('保存しました。');
  } catch (e) {
    status('保存できませんでした。時間をおいてもう一度試してください。', true);
  } finally { btn.disabled = false; }
});
$('save').disabled = true;
$('notes').textContent = '';
status('感想の保存を準備しています…');
(async () => {
  let db = null;
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) { status('この表示では感想を保存できません(ログインして開くと使えます)。', true); renderNotes([]); return; }
  notesCol = db.collection('notes');
  $('save').disabled = false; status('');
  notesCol.where('songId', '==', SONG.id).orderBy('createdAt', 'desc').limit(100).onSnapshot(
    (snap) => renderNotes(snap.docs),
    () => { status('過去の感想を読み込めませんでした。', true); }
  );
})();
</script>
