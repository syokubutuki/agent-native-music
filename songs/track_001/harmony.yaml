# One entry per bar. "A B" splits a bar evenly.
#
# v006 — direction "もっと陰鬱に、しかし透明感も" (feedback/preferences.jsonl):
# The hopeful VI-VII-i-v loop (v001-v005) is replaced by a LAMENT: the bass walks
# down by step F# - E - D - C# (i - v/5 - VI - V). Darkness comes from harmony,
# not from dulling the sound. The build's V no longer deceives into VI: the drop
# falls onto the minor tonic (V -> i), heavier and without consolation.
# Bm7 (iv) replaces VI in the second half for the darkest colour before the climax.
harmony:
  progressions:
    # v008 (critique v007-C2): C#m/E -> F#m7/E — the classic lament's second chord: the upper voices
    # hold A C# F# while only the bass walks F#-E-D; the minor third never disappears.
    lament: [F#m, F#m7/E, Dmaj7, Bm7]
  sections:
    intro: {progression: lament, repeat: 2}
    build: [Dmaj7, Bm7, C#m7, "C#sus4 C#"]
    drop:  [F#m, F#m7/E, Dmaj7, "C#sus4 C#", F#m, F#m7/E, Bm7, "C#sus4 C#"]
    end:   [F#m, F#m]     # merged into one 2-bar tonic event
