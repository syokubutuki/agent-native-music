# Degrees are relative to each part's `base` (degree 1). F# minor:
# 1=F# 2=G# 3=A 4=B 5=C# 6=D 7=E 8=F#(+8ve) 9=G#; "7#" = E# (leading tone).
# Lengths are 16th-note steps (16 per bar).
melody:
  motifs:
    # Hook: common-tone anchor (E5 on the downbeat) then a falling arpeggio
    # with a stepwise upturn. 3+3+4+2+4 syncopation.
    a: "7:3 5:3 3:4 4:2 5:4"
    # Build fragment: the first three notes of `a`, compressed.
    frag: "7:2 5:2 3:4"
  parts:
    lead:            # drop statement, sits A4..F#5
      base: F#4
      sections:
        drop:
          # v002 (critique C1): the build's leading tone E#5 resolves UP to F#5 on the
          # deceptive-cadence downbeat; later statements return to the E5 anchor.
          - {bar: 0, motif: a, ops: [{set: {0: 8}}, {accent: [0]}]}  # A* arrival (over Dmaj7: 3, maj7, 5)
          # v002 (C4): the question holds and breathes, ending open on B4 (5th of E)
          - {bar: 1, notes: "7:3 5:3 4:10"}                      # A' question
          - {bar: 2, motif: a}                                   # A re-harmonised over F#m
          - {bar: 3, notes: "5:3 4:3 2:6 r:2 3:1 4:1"}           # answer: sigh down to G#, pickup back in
          - {bar: 4, motif: a}
          - {bar: 5, motif: a, ops: [{transpose: -1, keep: [0]}, {set: {3: 4, 4: 7}}]}  # A'' turns upward
          # v002 (C1): climax A5 on the downbeat, above anything in the build; motif contour kept
          - {bar: 6, notes: "10:6! 8:2 5:4 7:2 8:2"}             # B: climax A5 held 1.5 beats (v004, v003-C4)
          - {bar: 7, notes: "7#:3 5:3 2:4 5:2 7#:4"}             # leading tone over V
        end:
          - {bar: 0, notes: "8:32!"}                             # resolution F#5, held through the 2-bar ending
    pluck:           # intro (octave down via track transpose) + build
      base: F#4
      sections:
        intro:
          # v002 (C4): first half only hints at the hook (first three notes); full form from bar 4
          - {bar: 0, motif: a, ops: [{take: [0, 3]}, {vel: 0.8}]}
          - {bar: 1, motif: a, ops: [{take: [0, 3]}, {transpose: -1, keep: [0]}, {vel: 0.8}]}
          - {bar: 2, motif: a, ops: [{take: [0, 3]}, {vel: 0.8}]}
          - {bar: 3, notes: "5:3 4:3 2:10"}
          # v004 (critique v003-C4): the intro withholds the upturn and the pickup — the drop is the first full reveal
          - {bar: 4, notes: "7:3 5:3 3:10"}
          - {bar: 5, motif: a, ops: [{transpose: -1, keep: [0]}]}
          - {bar: 6, notes: "7:3 5:3 3:4 4:2 3:4"}
          - {bar: 7, notes: "5:3 4:3 2:10"}
        build:
          - {bar: 0, motif: frag, repeat: 2}                      # fragment, twice per bar
          - {bar: 1, motif: frag, repeat: 2}
          - {bar: 2, notes: "3:2 4:2 5:2 7:2 4:2 5:2 7:2 8:2"}   # climbing 8ths
          - {bar: 3, notes: "8:2 8:2 8:2 8:2! 7#:2 7#:2 7#:2! r:2"}  # sus4 -> 3 in the melody
    topline:         # future vocal line: singable, G#4..F#5, rhythm leaves room for syllables
      base: F#4
      sections:
        drop:
          - {bar: 0, notes: "r:2 3:2 3:2 5:2 4:4 3:4"}
          - {bar: 1, notes: "2:6 1:2 2:8"}
          - {bar: 2, notes: "r:2 3:2 3:2 5:2 7:4 5:4"}
          - {bar: 3, notes: "4:6 3:2 2:8"}
          - {bar: 4, notes: "r:2 3:2 3:2 5:2 4:4 3:4"}
          - {bar: 5, notes: "2:6 1:2 2:8"}
          - {bar: 6, notes: "r:2 5:2 7:2 8:6 7:4"}              # v002 (C10): longer peak
          - {bar: 7, notes: "7#:6 5:2 5:8"}
