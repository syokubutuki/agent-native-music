# Voices (VOICEVOX). Generate with:  python -m music_agent voice songs/track_002
# The WAVs are cached in voice/ and committed; rendering never calls VOICEVOX.
# Credits required by the voice libraries: 「VOICEVOX:春日部つむぎ」「VOICEVOX:ずんだもん」
#
# Sung clips take their notes from the melody parts (one mora per note; the lyric count must match).
# Tsumugi sings an octave below her music box (transpose -12: F4-E5), the box doubles her above.
# Style ids (VOICEVOX 0.25): sing — つむぎ 3008, ずんだもん ノーマル 3003 / あまあま 3001 / なみだめ 3076;
#                            talk — つむぎ 8, ずんだもん 3.
voice:
  url: http://127.0.0.1:50021
  sing_teacher: 6000
  clips:
    # ---- intro: humming while getting ready, then the two lines that start the scene
    ts_hum:     {kind: sing, speaker: 3008, part: tsumugi, section: intro, bars: [0, 2], transpose: -12,
                 lyrics: "ふ ん ふ ふ ん ふ"}
    ts_line_go: {kind: talk, speaker: 8, text: "はーい、あたま洗うよー", at: "intro:2", intonation: 1.3}
    zd_line_ok: {kind: talk, speaker: 3, text: "はいなのだ！", at: "intro:3|1", intonation: 1.4}
    # ---- a: わしゃわしゃ
    ts_a1:      {kind: sing, speaker: 3008, part: tsumugi, section: a, bars: [0, 4], transpose: -12,
                 lyrics: "わ しゃ わ しゃ ね あ わ あ わ よ お め め と じ て"}        # わしゃわしゃね あわあわよ おめめとじて
    zd_line_tickle: {kind: talk, speaker: 3, text: "くすぐったいのだ", at: "a:3|1.5", intonation: 1.3, volume: 0.85}
    ts_a2:      {kind: sing, speaker: 3008, part: tsumugi, section: a, bars: [4, 8], transpose: -12,
                 lyrics: "く る く る り い い こ ず ん だ も ん ね"}                  # くるくるり いいこ ずんだもんね
    # ---- b: おしゃべり (2-bar call and response)
    zd_b1:      {kind: sing, speaker: 3003, part: zunda, section: b, bars: [0, 2],
                 lyrics: "あ わ が ふ わ ふ わ な の だ"}                              # あわが ふわふわなのだ
    ts_b1:      {kind: sing, speaker: 3008, part: tsumugi, section: b, bars: [2, 4], transpose: -12,
                 lyrics: "ほ ん と だ ね し ろ い く も"}                              # ほんとだね しろいくも
    zd_b2:      {kind: sing, speaker: 3076, part: zunda, section: b, bars: [4, 6],    # なみだめ: the pout
                 lyrics: "め に し み る の だ"}                                       # めにしみるのだ…
    ts_b2:      {kind: sing, speaker: 3008, part: tsumugi, section: b, bars: [6, 8], transpose: -12,
                 lyrics: "よ し よ し い く よ"}                                       # よしよし いくよ
    # ---- rinse
    zd_line_puha: {kind: talk, speaker: 3, text: "ぷはーっ！", at: "rinse:3|1", intonation: 1.5}
    # ---- a2: 湯ぶね (duet)
    ts_d1:      {kind: sing, speaker: 3008, part: tsumugi, section: a2, bars: [0, 4], transpose: -12,
                 lyrics: "ぽ か ぽ か ね ゆ げ の な か じゅ う か ぞ え て"}            # ぽかぽかね ゆげのなか じゅうかぞえて
    zd_d1:      {kind: sing, speaker: 3003, part: zunda, section: a2, bars: [3, 4],
                 lyrics: "い ち に さ ん"}                                           # いち に さん (counting with her)
    ts_d2:      {kind: sing, speaker: 3008, part: tsumugi, section: a2, bars: [4, 8], transpose: -12,
                 lyrics: "の ん び り ね い い お ゆ ね だ い す き だ よ ね"}          # のんびりね いいおゆね だいすきだよね
    zd_d2:      {kind: sing, speaker: 3003, part: zunda, section: a2, bars: [7, 8],
                 lyrics: "ぼ く も な の だ"}                                          # ぼくもなのだ
    # ---- end: ふぅ〜
    zd_end:     {kind: sing, speaker: 3001, part: zunda, section: end, bars: [0, 3],  # あまあま
                 lyrics: "ご く ら く な の だ"}                                       # ごくらくなのだ〜
    ts_end:     {kind: sing, speaker: 3008, part: tsumugi, section: end, bars: [1, 3], transpose: -12,
                 lyrics: "ほ ん と ね"}
    ts_line_fufu: {kind: talk, speaker: 8, text: "ふふっ", at: "end:3|1", volume: 0.8}
