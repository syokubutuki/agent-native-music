mix:
  sidechain_source: none        # no kick: nothing pumps
  tracks:
    # v009: the voices lead now; the music box steps back and doubles Tsumugi an octave above
    tsumugi:  {gain_db: -6.0, pan: 0.12, sends: {reverb: -9, delay: -17}}
    zunda:    {gain_db: -3.0, pan: -0.15, sends: {reverb: -11}}     # side by side
    ep:       {gain_db: -3.0, width: 1.1, sends: {reverb: -12}, chain: [{type: lowpass, freq: 4000}]}
    pad:      {gain_db: -12.0, width: 1.3, sends: {reverb: -8}}
    bass:     {gain_db: -1.5, sends: {reverb: -20}}
    shaker:   {gain_db: -9.0, pan: 0.3, sends: {reverb: -12}}
    bubbles:  {gain_db: -3.0, width: 1.2, sends: {reverb: -4, delay: -12}}   # wet: tiled walls
    droplets: {gain_db: -8.0, width: 1.3, sends: {reverb: -5, delay: -10}}
    tsumugi_vox: {gain_db: 6.0, pan: 0.12, sends: {reverb: -11, delay: -20}, chain: [{type: highpass, freq: 120}]}
    zunda_vox:   {gain_db: 6.0, pan: -0.15, sends: {reverb: -12}, chain: [{type: highpass, freq: 120}]}
    scrub:       {gain_db: 6.0, pan: 0.2, sends: {reverb: -16}, chain: [{type: highpass, freq: 200}]}
    rinse_water: {gain_db: 8.0, width: 1.2, sends: {reverb: -14}, chain: [{type: highpass, freq: 120}, {type: lowpass, freq: 9000}]}
    tub:         {gain_db: 5.0, sends: {reverb: -12}, chain: [{type: highpass, freq: 90}]}
    drips:       {gain_db: 18.0, pan: -0.3, sends: {reverb: -6}}
  returns:
    reverb:   # a tiled bathroom: short-ish, bright (little damping), strong early reflections
      chain: [{type: reverb, decay: 1.6, predelay_ms: 7, damping: 0.15, early: 0.7, hp: 250, lp: 9500, width: 1.0}]
    delay:
      chain: [{type: delay, time: "1/4", feedback: 0.3, hp: 500, lp: 5000, pingpong: true}]
  master:
    hpf: 30
    chain:
      - {type: compressor, threshold_db: -12, ratio: 1.5, attack_ms: 30, release_ms: 250}
    target_lufs: -15            # gentle: not a club track
    ceiling_db: -1.0
    limiter: {release_ms: 120, lookahead_ms: 5}
